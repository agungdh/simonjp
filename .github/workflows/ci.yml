name: CI build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Mandrel JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: mandrel
          java-version: 25
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install native-image dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc zlib1g-dev libfreetype6-dev

      - name: Build native executable
        run: ./gradlew build -Dquarkus.native.enabled=true
