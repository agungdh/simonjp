quarkus:
  # PDFBox logs a fallback-font warning for every standard 14 font because it maps
  # each base font to a metric-compatible system font for in-memory text metrics
  # (the PDF still references the base font by name, nothing is embedded). The
  # mapping always falls back on a headless image, so the warnings are noise.
  log:
    category:
      "org.apache.pdfbox.pdmodel.font":
        level: ERROR
  native:
    resources:
      includes:
        - images/**
    # POI's DrawPaint and PresetColor keep static java.awt.Color instances, which
    # GraalVM rejects in the image heap. Their static state is trivial, so initialize
    # them at run time.
    additional-build-args:
      - --initialize-at-run-time=org.apache.poi.sl.draw.DrawPaint,org.apache.poi.sl.usermodel.PresetColor
