quarkus:
  smallrye-openapi:
    info-title: SimonJP API
    info-version: 1.0.0
    info-description: REST API SimonJP.
  swagger-ui:
    always-include: true
    path: /q/swagger-ui

  datasource:
    db-kind: postgresql
    username: "${DB_USERNAME:admin}"
    password: "${DB_PASSWORD:admin}"
    jdbc:
      url: "${DB_URL:jdbc:postgresql://127.0.0.1:5432/simonjp}"

  hibernate-orm:
    schema-management:
      strategy: validate

  flyway:
    migrate-at-start: true
    locations: classpath:db/migration

  redis:
    hosts: "${REDIS_URL:redis://:admin@127.0.0.1:6379}"

  http:
    auth:
      permission:
        public:
          paths: /login,/healthcheck,/q/*,/openapi
          policy: permit
        authenticated:
          paths: /*
          policy: authenticated

# MicroProfile JWT verification
mp:
  jwt:
    verify:
      publickey:
        location: publicKey.pem
      issuer: simonjp
    token:
      header: Cookie
      cookie: SESSION

# SmallRye JWT signing
smallrye:
  jwt:
    sign:
      key:
        location: privateKey.pem
    new-token:
      issuer: simonjp

"%test":
  quarkus:
    http:
      auth:
        permission:
          authenticated:
            policy: permit
